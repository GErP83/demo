name: Build and Deploy Toucan Site

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build with Toucan Docker image
        run: |
          docker run --rm -v ${{ github.workspace }}:/src toucansites/toucan toucan generate

      - name: Upload static files
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./doc  # Toucan output directory

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4