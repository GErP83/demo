name: Build and Deploy Toucan Site

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check repo structure
        run: |
          echo "--- Project structure ---"
          find ${{ github.workspace }}

      - name: Build site using Toucan
        run: |
          mkdir -p ${{ github.workspace }}/docs
          sudo chown -R 1000:1000 ${{ github.workspace }}/docs
          docker run --rm \
            -v ${{ github.workspace }}:/site \
            -v ${{ github.workspace }}/docs:/site/docs \
            -w /site \
            toucansites/toucan generate ./src ./docs
          echo "--- Output directory contents ---"
          ls -alh ${{ github.workspace }}/docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4