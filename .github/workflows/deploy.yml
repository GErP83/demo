name: Build and Deploy Toucan Site

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-page:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build site using Toucan
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/site \
            -w /site \
            --user $(id -u):$(id -g) \
            toucansites/toucan generate ./src ./docs
      
      - name: Upload static site to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy-page:
    needs: build-page
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  delete-linux-artifacts:
    runs-on: ubuntu-latest
    needs: [build-page, deploy-page]
    if: always()
    steps:
      - name: Delete 'github-pages' if it exists
        run: |
          echo "🧹 Checking for 'github-pages' to delete..."

          # Check that gh CLI is available
          if ! command -v gh &> /dev/null; then
            echo "❌ GitHub CLI not found"
            exit 1
          fi

          # Get list of artifacts
          artifacts=$(gh api repos/${{ github.repository }}/actions/artifacts --paginate)
          id=$(echo "$artifacts" | jq -r '.artifacts[] | select(.name=="github-pages") | .id' | head -n1)

          if [[ -z "$id" || "$id" == "null" ]]; then
            echo "ℹ️ No artifact named 'github-pages' found"
          else
            echo "🗑 Deleting artifact ID $id"
            gh api --method DELETE repos/${{ github.repository }}/actions/artifacts/$id || echo "⚠️ Delete failed, continuing"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}